name: Build Android APK
on:
  workflow_dispatch:

# রিলিজ তৈরি করার পারমিশন দেওয়া হলো
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          rm -f package-lock.json
          npm install

      - name: Build Web App
        env:
          CI: false
        run: npm run build -- --emptyOutDir

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Fix Java Version in Gradle
        working-directory: android
        run: |
          sed -i 's/sourceCompatibility JavaVersion.VERSION_17/sourceCompatibility JavaVersion.VERSION_21/g' app/build.gradle
          sed -i 's/targetCompatibility JavaVersion.VERSION_17/targetCompatibility JavaVersion.VERSION_21/g' app/build.gradle
          sed -i 's/jvmTarget = "17"/jvmTarget = "21"/g' app/build.gradle

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload to Artifacts (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Auto Upload to Releases 🚀
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Mess App Update v${{ github.run_number }}
          body: "স্বয়ংক্রিয়ভাবে তৈরি করা নতুন আপডেট! 🎉"
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
